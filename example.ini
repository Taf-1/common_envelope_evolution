# SDSS J1411+2009 — eclipsing WD+BD; AGB progenitor (Littlefair+2014, Beuermann+2013)
# Table 1 & 2 of Zorotovic & Schreiber 2022 (stac1137)
# Expected alpha range (with min-age): 0.09–0.54

[binary]
stage_name   = J1411
log_file     = results/J1411/run.log
m_wd         = 0.53
sigma_mwd    = 0.03
m_bd         = 0.050
sigma_mbd    = 0.002
p_obs        = 0.0845327526
# measured from Littlefair+2014
r_wd         = 0.0142
sigma_rwd    = 0.0006
r_bd         = 0.072
sigma_rbd    = 0.004
a_obs        = 0.6761
sigma_a_obs  = 0.012
t_cool       = 260
sigma_tcool  = 20

[grid]
# AGB progenitor: kstar 5 (EAGB) and 6 (TPAGB)
kstar_giants = 5,6

[bounds]
t_min_age    = 3000
t_max_age    = 10000
# loose radius bounds — physics determines valid R1 at CE onset
r1_ce_min    = 0
r1_ce_max    = 1000000
alpha_min    = 0.09
alpha_max    = 0.54

[paths]
output_csv   = results/J1411/grid_results.csv
chain_csv    = results/J1411/chain.csv
walkers_plot = results/J1411/walkers.png
corner_plot  = results/J1411/corner.png
evolution_plot = results/J1411/best_fit_evolution.png
derived_csv  = results/J1411/derived_parameters.csv

[mcmc]
n_burnin     = 2000
n_steps      = 10000
t_max_plot   = 10000.0
